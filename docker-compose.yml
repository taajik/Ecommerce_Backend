
services:
  web:
    build: .
    restart: always
    command: gunicorn --bind 0.0.0.0:8000 core.wsgi:application
    env_file:
      - ./.env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.production
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:17
    restart: always
    env_file:
      - ./.env
    volumes:
      - pg_data:/var/lib/postgresql/data/
      - ./postgres/init/:/docker-entrypoint-initdb.d/:ro
    expose:
      - "5432"

volumes:
  pg_data:

