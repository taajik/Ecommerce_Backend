name: ebproj

services:
  web:
    build: .
    restart: unless-stopped
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 9
      --access-logfile /var/log/gunicorn/access.log
      --error-logfile /var/log/gunicorn/error.log
    env_file:
      - ./.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_PASSWORD: ""
    volumes:
      - static_volume:/app/assets
      - media_volume:/app/media
    expose:
      - "8000"
    depends_on:
      - db

  db:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DJANGO_SECRET_KEY: ""
    volumes:
      - pg_data:/var/lib/postgresql/data/
      - ./postgres/init/:/docker-entrypoint-initdb.d/:ro
    expose:
      - "5432"

  nginx:
    image: nginx:1.30.2-alpine
    restart: always
    environment:
      SERVER_NAMES: ${SERVER_NAMES}
    volumes:
      - static_volume:/var/www/ebproj/assets:ro
      - media_volume:/var/www/ebproj/media:ro
      - ssl_certs:/etc/nginx/certs:ro
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web

volumes:
  pg_data:
  static_volume:
  media_volume:
  ssl_certs:
